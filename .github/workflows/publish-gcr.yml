name: publish-gcr

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-gcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - run: gem install glossarist

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build one GCR per dataset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for dataset in datasets/*; do
            name=$(basename "$dataset")
            echo "::group::Packaging $name"
            glossarist package "$dataset" \
              -o "${name}-${VERSION}.gcr" \
              --shortname "$name" \
              --version "$VERSION" \
              --title "ISO/TC 204 ITS Vocabulary (${name})" \
              --owner "ISO/TC 204"
            glossarist package "$dataset" \
              -o "${name}-${VERSION}-full.gcr" \
              --shortname "$name" \
              --version "$VERSION" \
              --title "ISO/TC 204 ITS Vocabulary (${name})" \
              --owner "ISO/TC 204" \
              --compiled-formats tbx,jsonld,turtle,jsonl
            # Unversioned alias for "latest of this edition"
            cp "${name}-${VERSION}.gcr" "${name}.gcr"
            cp "${name}-${VERSION}-full.gcr" "${name}-full.gcr"
            echo "::endgroup::"
          done

      - name: Collect release files
        run: |
          mkdir -p release-assets
          # GCRs are built at the repo root (glossarist package writes
          # to the -o path, which is ${name}-${VERSION}.gcr at root).
          # Collect all .gcr files from root into release-assets/.
          cp *.gcr release-assets/ 2>/dev/null || { echo "No .gcr files found at root"; ls -la; exit 1; }
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "GCR Packages v${{ steps.version.outputs.version }}"
          body: |
            Auto-generated GCR packages for ISO/TC 204 ITS vocabulary.

            One package per dataset edition (lineage series):
            - `isotc204-2022-*.gcr` — Edition 1 (ISO/TS 14812:2022)
            - `isotc204-2025-*.gcr` — Edition 2 (ISO 14812:2025)
            - `isotc204-ed3-*.gcr`  — Edition 3 (draft)

            Each edition has a standard and a `-full` (compiled formats) variant.
          files: |
            release-assets/*.gcr
