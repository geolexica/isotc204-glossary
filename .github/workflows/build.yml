name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - run: gem install glossarist

      - name: Validate each dataset
        run: |
          for dataset in datasets/*; do
            echo "::group::Validating $dataset"
            glossarist validate "$dataset"
            echo "::endgroup::"
          done

  test-package:
    name: Test GCR packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - run: gem install glossarist

      - name: Build one GCR per dataset
        run: |
          for dataset in datasets/*; do
            name=$(basename "$dataset")
            echo "::group::Packaging $name"
            glossarist package "$dataset" -o "test-${name}.gcr" \
              --shortname "$name" \
              --version "0.0.0-test"
            echo "::endgroup::"
          done

      - name: Verify packages
        run: |
          for dataset in datasets/*; do
            name=$(basename "$dataset")
            test -f "test-${name}.gcr" || exit 1
          done
          echo "All packages built successfully"

  build-release:
    name: Build and release
    needs: validate
    uses: geolexica/ci/.github/workflows/glossary-build.yml@main

  trigger-deploy:
    name: Trigger downstream repositories
    needs: build-release
    uses: geolexica/ci/.github/workflows/glossary-trigger.yml@main
    with:
      repository: geolexica/isotc204.geolexica.org
    secrets:
      token: ${{ secrets.GLOSSARIST_CI_PAT_TOKEN }}
