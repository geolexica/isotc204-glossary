  definition:
  - content: |-
      portion of {{urn:iso:std:iso:14812:ed3:3.3.1.5,carriageway}} designed to accommodate a single line of moving {{urn:iso:std:iso:14812:ed3:3.7.6.1,road vehicles}}
      <img alt="traffic lane Diagram" src="../../diagrams/traffic lane.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  examples: []
  notes:
  - content: A traffic lane can be bi-directional, such as a single lane {{urn:iso:std:iso:14812:ed3:3.3.5.1,road}},
      a two-way turn/overtaking lane, or a reversible flow lane.
  - content: Some jurisdictions allow supplemental uses of a traffic lane, such as
      multiple motorcycles sharing the width of a traffic lane or allowing a bicycle
      to use the edge of a lane.
  - content: The term "lane" is often used to refer to a "traffic lane" when the context
      is known to be "traffic".
