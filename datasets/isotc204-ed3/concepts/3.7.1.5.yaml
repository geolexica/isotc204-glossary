data:
  definition:
  - content: input device designed to be physically {{urn:iso:std:iso:14812:ed3:3.2.3.6,connected}}
      to a {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}} and to remain connected even
      when the vehicle is not in use
  notes:
  - content: Built-in input devices are typically considered to be a part of the vehicle.
  - content: Built-in input devices include devices that can be temporarily {{urn:iso:std:iso:14812:ed3:3.7.4.3,disconnected}}
      for security reasons (e.g. some radios are equipped with detachable front panels).
  - content: Built-in input devices require a maintenance operation to connect or
      disconnect.
  terms:
  - type: expression
    normative_status: preferred
    designation: built-in vehicle input device
  - type: expression
    normative_status: admitted
    designation: built-in input device
