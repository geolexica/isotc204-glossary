data:
  definition:
  - content: hardware and software {{urn:iso:std:iso:14812:ed3:3.1.2.1,system}} that
      is able to perform part or all of the {{urn:iso:std:iso:14812:ed3:3.7.3.1,dynamic
      driving task}} on a sustained basis
  notes:
  - content: A driving automation system includes any system capable of level 1-5
      driving automation.
  - content: Driving automation levels are defined in ISO/SAE 22736, which is also
      known as SAE J3016.
  - content: Driving automation levels include {{urn:iso:std:iso:14812:ed3:3.7.3.8,level
      1 driving automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.9,level 2 driving
      automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.11,level 3 ADS}}, {{urn:iso:std:iso:14812:ed3:3.7.3.12,level
      4 ADS}}, and {{urn:iso:std:iso:14812:ed3:3.7.3.13,level 5 ADS}}.
  - content: In contrast to this generic term for any level 1-5 system, the specific
      term for a level 3-5 system is "Automated Driving System (ADS)." Given the similarity
      between the generic term, "driving automation system," and the level 3-5-specific
      term, "Automated Driving System," the latter term is intentionally capitalized
      when spelled out and reduced to its acronym, "ADS", as much as possible, while
      "driving automation system" should not be.
  terms:
  - type: expression
    normative_status: preferred
    designation: driving automation system
  language_code: eng
  entry_status: valid
