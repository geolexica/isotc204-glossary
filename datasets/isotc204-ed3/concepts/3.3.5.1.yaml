data:
  definition:
  - content: curvilinear length of {{urn:iso:std:iso:14812:ed3:3.3.1.3,roadway}} that
      shares the same {{urn:iso:std:iso:14812:ed3:3.3.5.12,road identifier}}
  notes:
  - content: A length of the {{urn:iso:std:iso:14812:ed3:3.3.5.2,road network}} may
      be referenced by multiple designators (e.g. Main Street and Route 7). In this
      case, there would be two {{urn:iso:std:iso:14812:ed3:3.3.5.1,roads}} that share
      the same set of {{urn:iso:std:iso:14812:ed3:3.3.1.5,carriageways}}.
  - content: A road can change directions at a {{urn:iso:std:iso:14812:ed3:3.3.6.2,junction}}.
  - content: The identification is generally a name or number.
