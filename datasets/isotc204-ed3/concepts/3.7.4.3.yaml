data:
  definition:
  - content: |-
      characteristic of a {{urn:iso:std:iso:14812:ed3:3.1.1.3,material entity}} that is or was equipped with communications equipment that is sufficiently physically disconnected such that the material entity is no longer able to send data to or receive data from {{urn:iso:std:iso:14812:ed3:3.2.3.6,connected}} entities
      <img alt="disconnected Diagram" src="../../diagrams/disconnected.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  notes:
  - content: The vehicle on-board equipment can still be present in the {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}}
      and can even be partially connected, but not in any operational sense.
  terms:
  - type: expression
    normative_status: preferred
    designation: disconnected
  - type: expression
    normative_status: admitted
    designation: ITS disconnected
