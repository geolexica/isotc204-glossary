data:
  definition:
  - content: physically marked location to enhance the safety of pedestrians crossing
      one or more lanes of a different mode of travel
  notes:
  - content: In some cases, local regulations can require vehicles to give way to
      the pedestrians in the pedestrian crossing and/or restrict pedestrians to only
      cross at pedestrian crossings.
  - content: Pedestrian permission and/or priority at crossing can be managed when
      traffic signals are present.
  terms:
  - type: expression
    normative_status: preferred
    designation: pedestrian crossing
  - type: expression
    normative_status: admitted
    designation: crosswalk
