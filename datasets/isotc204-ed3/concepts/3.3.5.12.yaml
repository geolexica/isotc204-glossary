data:
  definition:
  - content: designator by a road authority to uniquely identify one or more curvilinear
      lengths of {{urn:iso:std:iso:14812:ed3:3.3.1.3,roadway}} within the context
      of the road authority
  notes:
  - content: A single road identifier can be assigned to non-contiguous lengths of
      roadway.
  - content: The identifier is typically either a name (e.g., Main Street), a class
      of road coupled with a number (e.g., "M25" meaning "motorway no. 25").
  - content: The same road identifier can be allocated by different road authorities
      to different, physically distinct, curvilinear lengths of roadway.
  terms:
  - type: expression
    normative_status: preferred
    designation: road identifier
