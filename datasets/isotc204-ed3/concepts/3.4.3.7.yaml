data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.1.1.6,person}} or organization who has {{urn:iso:std:iso:14812:ed3:3.4.3.4,jurisdiction}}
      <img alt="jurisdictional entity Diagram" src="../../diagrams/jurisdictional entity.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      EXAMPLE: A city government
      ---
      Comment on this page
  examples: []
  notes:
  - content: A jurisdictional entity assigns its authority to one or more rule-makers,
      which may be itself (e.g., the individual owner or a campus) or other divisions
      of the entity (e.g., police department, traffic department).
  - content: In the case of a geopolitical jurisdiction, the jurisdictional entity
      is typically the recognized government for the territory; in the case of a campus,
      the jurisdictional entity is typically the landowner.
  terms:
  - type: expression
    normative_status: preferred
    designation: jurisdictional entity
  language_code: eng
