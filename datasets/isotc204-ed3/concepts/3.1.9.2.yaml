  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.1.3.1,architecture}} that provides a long-term vision of system {{urn:iso:std:iso:14812:ed3:3.1.3.10,elements}} that may be deployed and managed by different projects and/or {{urn:iso:std:iso:14812:ed3:3.1.1.1,entities}} within a geographic area
      Admitted term: regional architecture
  notes:
  - content: Some countries use the term "regional architecture", but in International
      Standards, the term "regional" is avoided due to its multiple meanings.
