data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.5.2.1,transport service}} that {{urn:iso:std:iso:14812:ed3:3.5.9.2,sequentially}}
      provides the same {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicles}} to multiple
      unrelated {{urn:iso:std:iso:14812:ed3:3.5.2.3,transport users}} and where the
      transport user has the primary responsibility for the operation of the vehicle"
  notes:
  - content: As there should only be one operator of a vehicle at any time, a shared
      vehicle service should use a sequential operational model.
  - content: This term can be specialized by replacing "vehicle" with any defined
      vehicle type (e.g. "automated vehicle sharing").
  terms:
  - type: expression
    normative_status: preferred
    designation: shared vehicle service
  language_code: eng
  entry_status: valid
