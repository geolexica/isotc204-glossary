data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.7.3,bridge}} with a deck that can be
      moved in a way that disrupts the continuous travel path"
  notes:
  - content: Movable bridges can be used over waterways to allow for the passage of
      tall ships.
  - content: Movable bridges include, but are not limited to, bascule bridges, vertical
      lift bridges, and swing bridges.
