data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.5.2.1,transport service}} that is publicly accessible enabling the movement of one or more {{urn:iso:std:iso:14812:ed3:3.1.1.6,persons}}
      Example 1: Bus, tram, cable car, metro, train and ferry are examples of public transport means for collective use.
      Example 2: Publicly-accessible shared cars, shared bikes and shared el-scooters are examples of public transport means for shared and individual use.
  notes:
  - content: A public transport service can be scheduled or on-demand.
  - content: A public transport service is based on the use of publicly accessible
      transport means for collective, shared or individual use.
  terms:
  - type: expression
    normative_status: preferred
    designation: public transport
  - type: expression
    normative_status: admitted
    designation: public transport service
