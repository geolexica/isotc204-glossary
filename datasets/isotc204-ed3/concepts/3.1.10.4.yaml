data:
  definition:
  - content: |-
      electronic {{urn:iso:std:iso:14812:ed3:3.1.10.3,data dictionary}} that follows precise documented rules for the registration and management of stored {{urn:iso:std:iso:14812:ed3:3.1.10.1,data concepts}}
      <img alt="data concept registry Diagram" src="../../diagrams/data concept registry.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  notes:
  - content: A data concept registry typically includes advanced features for adding
      retrieving, and working with its contents.
  - content: The data concept registry contains {{urn:iso:std:iso:14812:ed3:3.1.10.2,meta-attributes}}
      about {{urn:iso:std:iso:14812:ed3:3.1.10.1,data concepts}} in terms of their
      names and representational forms as well as the semantics associated with the
      data concepts. A data concept registry may contain metadata that assists information
      interchange and re-use, both from the perspective of human users and for machine-interpretation
      of data concepts.
  terms:
  - type: expression
    normative_status: preferred
    designation: data concept registry
