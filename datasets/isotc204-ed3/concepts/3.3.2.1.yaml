data:
  definition:
  - content: mechanism used to physically separate a travelled way or pathway from
      the adjacent environment
  notes:
  - content: Mechanisms include various types of barriers, such as walls, rails, pylons,
      kerbs and ditches, as well as open, unpaved space. If two streams of traffic
      are only separated by paved space (including any markings and rumble strips),
      they share a common carriageway.
  - content: The adjacent environment can be an opposing direction of travel, a different
      mode of travel, the edge of a bridge, etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: physical traffic separator
  language_code: eng
  entry_status: valid
