data:
  definition:
  - content: |-
      input device that can be carried into, or in near proximity of, a {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}} and {{urn:iso:std:iso:14812:ed3:3.2.3.6,connected}} as desired
      <img alt="nomadic vehicle input device Diagram" src="../../diagrams/nomadic vehicle input device.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      EXAMPLE: A smartphone connected to a vehicle (via USB or Bluetooth) to provide {{urn:iso:std:iso:14812:ed3:3.6.2.3,driver}} navigation on the vehicle's large screen display
      ---
      Comment on this page
  notes:
  - content: NDs are often more closely associated with a {{urn:iso:std:iso:14812:ed3:3.1.1.6,person}}
      than they are with the vehicle.
  - content: Nomadic input devices do not require a maintenance operation to connect
      or disconnect.
  terms:
  - type: expression
    normative_status: preferred
    designation: nomadic vehicle input device
  - type: expression
    normative_status: admitted
    designation: nomadic input device
