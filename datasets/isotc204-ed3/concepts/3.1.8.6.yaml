data:
  definition:
  - content: set of related {{urn:iso:std:iso:14812:ed3:3.1.7.2,processes}} that are
      performed by a {{urn:iso:std:iso:14812:ed3:3.1.8.1,physical object}} to fulfil
      aspects of an {{urn:iso:std:iso:14812:ed3:3.5.3.1,ITS service}}
  examples:
  - content: A vehicle OBE can include a "vehicle basic safety" functional object.
  notes:
  - content: The term "module" is used by the European FRAME architecture while the
      Architecture Reference for Cooperative and Intelligent Transportation (ARC-IT)
      uses the term "functional object".
  terms:
  - type: expression
    normative_status: preferred
    designation: functional object
  - type: expression
    normative_status: admitted
    designation: ITS functional object
