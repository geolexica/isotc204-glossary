      {{urn:iso:std:iso:14812:ed3:3.7.2.1,speed}} of a {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}} that exceeds speeds typical of pedal cycles but can be reached on performance pedal cycles in short bursts or by performance riders
