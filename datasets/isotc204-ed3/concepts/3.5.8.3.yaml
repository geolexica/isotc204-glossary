  - content: |-
      type of {{urn:iso:std:iso:14812:ed3:3.5.8.1,financial model}} where {{urn:iso:std:iso:14812:ed3:3.5.1.1,services}} are provided by an administrative authority in an attempt to better serve societal interests
      <img alt="public Diagram" src="../../diagrams/public.dot.png" /> <!-- Fallback for non-SVG browsers -->
