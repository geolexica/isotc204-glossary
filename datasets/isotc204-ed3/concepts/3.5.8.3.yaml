      ---
      Comment on this page
  notes:
  - content: The transport service [transport service.md] is typically offered to
      the transport consumer for less than the full capital and operating cost of
      providing the service, but this is not a requirement.
  - content: Typically, the administrative authority is a local government agency;
      but it could be another administrative authority, such as the national government
      or a {{urn:iso:std:iso:14812:ed3:3.5.8.2,commercial}} {{urn:iso:std:iso:14812:ed3:3.1.1.1,entity}}
      managing transport needs [transport needs.md] on their campus.
