data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.1.2.1,system}} comprised of information, communication, sensor and control technologies and that is designed to benefit a {{urn:iso:std:iso:14812:ed3:3.1.2.3,surface transport system}}
      Admitted term: intelligent transportation system
  notes:
  - content: '"Intelligent transportation system" is the American English equivalent.'
  - content: Benefits potentially include, but are not limited to, increased safety,
      sustainability, efficiency and comfort.
  - content: The full term (i.e. "intelligent transport system") is often used when
      the noun is used as a subject, whereas the abbreviation (i.e. "ITS") is often
      used to modify another noun (e.g. "Intelligent transport systems provide ITS
      services.").
  terms:
  - type: expression
    normative_status: preferred
    designation: intelligent transport system
  - type: expression
    normative_status: admitted
    designation: ITS
  language_code: eng
  entry_status: valid
