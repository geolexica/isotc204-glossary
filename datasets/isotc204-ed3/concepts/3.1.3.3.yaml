  - content: |-
      conventions, principles and practices for the description of {{urn:iso:std:iso:14812:ed3:3.1.3.1,architectures}} established within a specific domain of application and/or community of {{urn:iso:std:iso:14812:ed3:3.1.3.4,stakeholders}}
      Example 1: Generalised Enterprise Reference Architecture and Methodologies (GERAM) [ISO 15704] is an architecture framework.
      Example 2: Reference Model of Open Distributed Processing (RM-ODP) [ISO/IEC 10746] is an architecture framework.
