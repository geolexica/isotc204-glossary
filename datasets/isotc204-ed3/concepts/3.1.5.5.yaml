data:
  definition:
  - content: |-
      communications layer in the {{urn:iso:std:iso:14812:ed3:3.1.9.4,ITS station reference architecture}} corresponding to the session, presentation and application layers of the OSI model
      Deprecated term: application layer
  notes:
  - content: Within the US, the NTCIP standards call the facilities layer the "application
      layer". However, as this term is easily confused with both the OSI application
      layer and the {{urn:iso:std:iso:14812:ed3:3.1.5.1,application entity}}, the
      term should be avoided and qualified when used (e.g. OSI application layer).
  terms:
  - type: expression
    normative_status: preferred
    designation: facilities layer
  - type: expression
    normative_status: admitted
    designation: ITS-S facilities layer
