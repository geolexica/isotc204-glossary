data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.5.5,link}} representing a contiguous
      length of a {{urn:iso:std:iso:14812:ed3:3.3.5.1,road}} between two {{urn:iso:std:iso:14812:ed3:3.3.5.4,nodes}}
      of operational or managerial significance"
  notes:
  - content: The operational characteristics of the nodes would relate to the type
      of {{urn:iso:std:iso:14812:ed3:3.3.5.3,road model}}. For example, a traffic
      {{urn:iso:std:iso:14812:ed3:3.1.2.1,system}} can base its road links on nodes
      that represent {{urn:iso:std:iso:14812:ed3:3.3.6.2,junctions}} and road terminators.
  terms:
  - type: expression
    normative_status: preferred
    designation: road link
  language_code: eng
  entry_status: valid
