data:
  definition:
  - content: |-
      contiguous area of paved {{urn:iso:std:iso:14812:ed3:3.3.1.3,roadway}} designed for the use of vehicles along a {{urn:iso:std:iso:14812:ed3:3.3.5.8,road segment}}
      <img alt="carriageway Diagram" src="../../diagrams/carriageway.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      | Referencing Term | Type of Reference |
      | --- | --- |
      | {{urn:iso:std:iso:14812:ed3:3.3.1.8,dual carriageway}} | comprises |
      | {{urn:iso:std:iso:14812:ed3:3.3.1.9,multiple carriageway}} | comprises |
      | {{urn:iso:std:iso:14812:ed3:3.3.1.7,single carriageway}} | comprises |
      ---
      Comment on this page
  examples: []
  notes:
  - content: A carriageway is comprised of one or more {{urn:iso:std:iso:14812:ed3:3.3.1.13,traffic
      lanes}} {{urn:iso:std:iso:14812:ed3:3.3.1.15,i.e. the [usable width}}] and could
      include {{urn:iso:std:iso:14812:ed3:3.3.1.18,shoulders}} and {{urn:iso:std:iso:14812:ed3:3.3.1.16,lay-bys}}.
  - content: Carriageways are separated by {{urn:iso:std:iso:14812:ed3:3.3.2.1,physical
      traffic separators}}.
  - content: When looking at a {{urn:iso:std:iso:14812:ed3:3.3.1.1,cross-section}}
      of the {{urn:iso:std:iso:14812:ed3:3.3.1.2,road reservation}}, the roadway consists
      of all of the carriageways.
