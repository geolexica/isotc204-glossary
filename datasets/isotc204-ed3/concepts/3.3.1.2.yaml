  definition:
  - content: |-
      area legally reserved for {{urn:iso:std:iso:14812:ed3:3.3.5.1,road}} transport purposes and support
      <img alt="road reservation Diagram" src="../../diagrams/road reservation.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  notes:
  - content: Support includes physical equipment such as safety devices, signage and
      controller cabinets as well as access by maintenance vehicles and personnel.
  - content: The road reservation includes all {{urn:iso:std:iso:14812:ed3:3.3.1.5,carriageways}}
      as well as width to allow for {{urn:iso:std:iso:14812:ed3:3.3.1.10,roadside}}
      devices, {{urn:iso:std:iso:14812:ed3:3.3.1.18,shoulders}}, {{urn:iso:std:iso:14812:ed3:3.3.1.11,verges}},
      footways, drainage facilities, sound walls, slopes, embankments, etc.
