  examples: []
  notes:
  - content: The grade separation allows {{urn:iso:std:iso:14812:ed3:3.6.1.1,travellers}}
      on the {{urn:iso:std:iso:14812:ed3:3.3.5.5,link}} to pass unimpeded through
      the interchange when congestion is not present.
  - content: The term "interchange" typically refers to the facilities that enable
      all available manoeuvres at the grade separated {{urn:iso:std:iso:14812:ed3:3.3.6.1,intersection}},
      which typically includes multiple junctions.
