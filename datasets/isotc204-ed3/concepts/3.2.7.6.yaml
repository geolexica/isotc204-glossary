data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.2.7.8,ITS-S node}} comprised of {{urn:iso:std:iso:14812:ed3:3.2.7.3,ITS-S}}
      functionalities other than the functionalities of an {{urn:iso:std:iso:14812:ed3:3.2.7.7,ITS-S
      router}}, ITS-S border router, ITS-S mobile router or an ITS-S gateway"
  notes:
  - content: ITS-S border router and ITS-S mobile router are ITS-S routers with added
      functionalities, which is why they are separately excluded in the above definition.
  - content: ITS-S border router, ITS-S mobile router, and ITS-S gateway are defined
      in ISO 21217.
  terms:
  - type: expression
    normative_status: preferred
    designation: ITS-S host
  - type: expression
    normative_status: admitted
    designation: management host
  language_code: eng
  entry_status: valid
