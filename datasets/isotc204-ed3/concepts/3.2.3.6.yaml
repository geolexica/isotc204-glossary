data:
  definition:
  - content: characteristic of a {{urn:iso:std:iso:14812:ed3:3.1.1.3,material entity}}
      that is equipped with enabled (i.e. on) and operational electronic communication
      technologies to support {{urn:iso:std:iso:14812:ed3:3.5.3.1,ITS services}},
      including the means to send and receive data to and from other connected entities
  notes:
  - content: The term "connected" does not imply support for any specific communications
      interface or ITS-S application process [ITS-S application process.md].
  terms:
  - type: expression
    normative_status: preferred
    designation: connected
  - type: expression
    normative_status: admitted
    designation: ITS connected
  language_code: eng
  entry_status: valid
  annotations: []
