data:
  definition:
  - content: "<generic> portion of {{urn:iso:std:iso:14812:ed3:3.3.1.2,road reservation}}
      intended to accommodate a single line of moving {{urn:iso:std:iso:14812:ed3:3.1.1.3,material
      entities}} along its length"
  examples:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.1.13,Traffic lane}}, {{urn:iso:std:iso:14812:ed3:3.3.3.1,cycle
      lane}}, {{urn:iso:std:iso:14812:ed3:3.3.3.4,sidewalk}}."
  notes:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.1.12,Lanes}} are often bounded by lane
      markings."
  - content: Lanes may be significantly wider than the normal {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}}
      width to allow variance in lane position of the vehicle as well as for various
      vehicle dimensions.
  - content: The "lane" nomenclature typically refers to {{urn:iso:std:iso:14812:ed3:3.7.6.3,motor
      vehicle}} usage, but can also refer to other purposes, such as {{urn:iso:std:iso:14812:ed3:3.3.3.4,sidewalks}}.
