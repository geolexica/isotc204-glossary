      of different modes, separate a {{urn:iso:std:iso:14812:ed3:3.3.1.13,traffic
      lane}} from a ditch, or separate a lane from another safety hazard.
  - content: Roadside, {{urn:iso:std:iso:14812:ed3:3.3.1.18,shoulder}} and verge define
      similar but slightly different concepts.
