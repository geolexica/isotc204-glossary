data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.3.5.5,link}} that represents a {{urn:iso:std:iso:14812:ed3:3.3.1.12,lane}} of a {{urn:iso:std:iso:14812:ed3:3.3.5.6,road link}}
      <img alt="lane link Diagram" src="../../diagrams/lane link.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  notes:
  - content: A {{urn:iso:std:iso:14812:ed3:3.3.5.10,lane segment}} can start or end
      at {{urn:iso:std:iso:14812:ed3:3.4.1.2,spatial locations}} other than the start
      or end of the corresponding {{urn:iso:std:iso:14812:ed3:3.3.5.8,road segment}}
      (e.g. a lane can start mid-block).
  - content: A lane segment only includes the sequential lane links, it does not include
      lane links from adjacent lanes.
