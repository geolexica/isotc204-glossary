data:
  definition:
  - content: |-
      set of ideas, abstractions or things in the real world that are identified with explicit boundaries and meaning and whose properties and behaviour follow the same rules
      Admitted term: object class
      Source: ISO/IEC 11179-1:2015, 3.3.18, modified - term changed to from "object class" to "class" and Notes to entry added.
  notes:
  - content: Some ISO/TC 204 documents use the term "object class" for consistency
      with ISO 11179-1, but within ITS, the term "class" is more generally understood.
  - content: This is semantically equivalent to a "class" as used within UML (ISO19505-2:2012).
  terms:
  - type: expression
    normative_status: preferred
    designation: class
  language_code: eng
