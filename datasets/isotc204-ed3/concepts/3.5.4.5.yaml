  notes:
  - content: The definition of ITS-S service predates the adoption of the concept
      model used for the other service terms in this standard. It is an outlier in
      that it describes a portion of the functionality contained within the ITS station
      reference architecture (i.e., the communication functionality) rather than the
      end functionality of the conceptual ITS station.
