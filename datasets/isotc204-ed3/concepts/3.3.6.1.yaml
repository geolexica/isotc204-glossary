---
data:
  definition:
  - content: space where two or more {{urn:iso:std:iso:14812:ed3:3.3.5.1,roads}} meet
      or cross
  notes:
  - content: Complex intersections can be viewed as multiple intersections by providing
      separate designations for distinct {{urn:iso:std:iso:14812:ed3:3.3.5.6,road
      links}}. For example, one model could depict a complex intersection as being
      associated with multiple junctions; another model could depict the same physical
      infrastructure as being multiple intersections that are interconnected by different
      {{urn:iso:std:iso:14812:ed3:3.3.5.1,roads}}, each with its own designator (e.g.
      "ramp from northbound Road A to eastbound Road B").
  - content: Intersections can be associated with zero {{urn:iso:std:iso:14812:ed3:3.3.6.2,junctions}},
      such as a motorway crossing a road without any connecting ramps, or can be associated
      with one or more junctions, such as a diamond {{urn:iso:std:iso:14812:ed3:3.3.6.9,interchange}}.
  terms:
  - type: expression
    normative_status: preferred
    designation: intersection
  language_code: eng
  entry_status: valid
