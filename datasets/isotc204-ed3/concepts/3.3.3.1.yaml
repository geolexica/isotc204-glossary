data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.3.1.12,lane}} designed for the through movement of cycles
      <img alt="cycle lane Diagram" src="../../diagrams/cycle lane.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  examples: []
  notes:
  - content: Cycle lanes are typically much narrower than {{urn:iso:std:iso:14812:ed3:3.3.1.13,traffic
      lanes}}.
  - content: Cycle lanes are typically part of either a {{urn:iso:std:iso:14812:ed3:3.3.1.5,carriageway}}
      or a {{urn:iso:std:iso:14812:ed3:3.3.3.2,cycleway}}.
  - content: Cycle lanes could also allow and be designed for {{urn:iso:std:iso:14812:ed3:3.7.6.2,motorized
      vehicles}} (e.g. e-scooters, mopeds, etc.) with similar performance characteristics
      as human-powered cycles, subject to local regulations.
  terms:
  - type: expression
    normative_status: preferred
    designation: cycle lane
  language_code: eng
  entry_status: valid
