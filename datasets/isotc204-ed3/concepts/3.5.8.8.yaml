data:
  definition:
  - content: characteristic of a {{urn:iso:std:iso:14812:ed3:3.5.8.1,financial model}}
      that requires {{urn:iso:std:iso:14812:ed3:3.5.1.3,users}} to enter into an agreement
      prior to receiving {{urn:iso:std:iso:14812:ed3:3.5.1.1,services}}
  notes:
  - content: The agreement can be associated with fees.
  - content: The agreement can be minimal, such as collecting user information for
      business purposes.
  - content: The membership can be granted as a part of a broader agreement. For example,
      a university bus {{urn:iso:std:iso:14812:ed3:3.1.2.1,system}} can restrict access
      to students and faculty.
  terms:
  - type: expression
    normative_status: preferred
    designation: membership-based
  language_code: eng
  entry_status: valid
  annotations: []
