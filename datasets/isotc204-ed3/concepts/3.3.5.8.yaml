data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.5.5,link}} that represents a contiguous
      length of a {{urn:iso:std:iso:14812:ed3:3.3.5.6,road link}} characterized by
      the same physical characteristics"
  notes:
  - content: The definition of road segments is highly dependent on which characteristics
      are modelled by the implementation. Characteristics that can result in a new
      road segment include addition or subtraction of a {{urn:iso:std:iso:14812:ed3:3.3.1.12,lane}},
      a change in {{urn:iso:std:iso:14812:ed3:3.3.1.3,roadway}} width, the change
      of {{urn:iso:std:iso:14812:ed3:3.3.5.1,road}} type (e.g. start/end of a bridge),
      etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: road segment
  language_code: eng
  entry_status: valid
  annotations: []
