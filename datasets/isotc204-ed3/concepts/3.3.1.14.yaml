      {{urn:iso:std:iso:14812:ed3:3.3.1.13,traffic lane}} restricted to a specific subset of {{urn:iso:std:iso:14812:ed3:3.7.6.1,road vehicles}} or {{urn:iso:std:iso:14812:ed3:3.5.1.3,user}} categories
