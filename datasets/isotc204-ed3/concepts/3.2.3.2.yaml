data:
  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.2.1.2,field system}} that performs localized {{urn:iso:std:iso:14812:ed3:3.5.3.1,ITS services}}
      <img alt="ITS roadside equipment Diagram" src="../../diagrams/ITS roadside equipment.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      EXAMPLE: traffic signal controller, variable message sign, vehicle detection
      ---
      Comment on this page
  notes:
  - content: '"ITS roadway equipment" is used within the current version of the Architecture
      Reference for Cooperative and Intelligent Transportation (ARC-IT; see Reference
      [25]). The term {{urn:iso:std:iso:14812:ed3:3.3.1.3,roadway}} has been revised
      to reflect that the equipment is typically along the roadway rather than a part
      of the roadway.'
  - content: ITS services that can be performed by ITS roadside equipment include
      surveillance, traffic control, information provision, payment transaction services,
      and/or enforcement
  - content: While the term "roadside" indicates the typical location of the equipment,
      ITS roadside equipment (or portions thereof) can be embedded in the roadway
      itself.
  terms:
  - type: expression
    normative_status: preferred
    designation: ITS roadside equipment
  - type: expression
    normative_status: admitted
    designation: ITS roadway equipment
