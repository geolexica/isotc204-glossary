  definition:
  - content: |-
      malfunction in a {{urn:iso:std:iso:14812:ed3:3.2.1.5,vehicle system}} that prevents the {{urn:iso:std:iso:14812:ed3:3.7.3.6,driving automation system}} from reliably performing its portion of the {{urn:iso:std:iso:14812:ed3:3.7.3.1,dynamic driving task}} on a sustained basis
