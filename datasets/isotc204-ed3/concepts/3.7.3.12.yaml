data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.7.3.10,ADS}} that is capable of operating
      within a specific {{urn:iso:std:iso:14812:ed3:3.7.3.2,operational design domain}}
      and providing its own {{urn:iso:std:iso:14812:ed3:3.7.3.3,fallback}}, without
      any expectation that a human {{urn:iso:std:iso:14812:ed3:3.6.2.3,driver}} will
      respond to a request to intervene"
  notes:
  - content: Other driving automation levels include {{urn:iso:std:iso:14812:ed3:3.7.3.8,level
      1 driving automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.9,level 2 driving
      automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.11,level 3 ADS}}, and {{urn:iso:std:iso:14812:ed3:3.7.3.13,level
      5 ADS}}.
  terms:
  - type: expression
    normative_status: preferred
    designation: level 4 ADS
  - type: expression
    normative_status: admitted
    designation: high driving automation
  - type: expression
    normative_status: admitted
    designation: level 4 Automated Driving System
