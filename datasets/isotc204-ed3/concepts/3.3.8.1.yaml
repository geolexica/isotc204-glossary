data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.3.8.3,parking space}} for a designated
      purpose Note 1 to entry:  Note 2 to entry:"
  notes:
  - content: Designated parking spaces include those that require permits (e.g., reserved
      for those with disabilities) as well as advisory notices that rely upon voluntary
      compliance (e.g., reserved for expectant mothers).
  - content: The term "designated parking space" is often specialized to indicate
      the type of designation (e.g., "electric vehicle parking space").
