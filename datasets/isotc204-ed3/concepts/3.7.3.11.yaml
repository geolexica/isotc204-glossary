data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.7.3.10,ADS}} designed with the expectation
      that the {{urn:iso:std:iso:14812:ed3:3.7.3.4,fallback-ready user}} is available
      to intervene"
  notes:
  - content: Level 3 ADSs are restricted to operating within a specific {{urn:iso:std:iso:14812:ed3:3.7.3.2,operational
      design domain}}.
  - content: Other driving automation levels include {{urn:iso:std:iso:14812:ed3:3.7.3.8,level
      1 driving automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.9,level 2 driving
      automation}}, {{urn:iso:std:iso:14812:ed3:3.7.3.12,level 4 ADS}}, and {{urn:iso:std:iso:14812:ed3:3.7.3.13,level
      5 ADS}}.
  - content: The user can intervene due to an ADS-issued request, a {{urn:iso:std:iso:14812:ed3:3.7.3.1,dynamic
      driving task}} performance-relevant system failure, or other reasons.
  terms:
  - type: expression
    normative_status: preferred
    designation: level 3 ADS
  - type: expression
    normative_status: admitted
    designation: conditional driving automation
  - type: expression
    normative_status: admitted
    designation: level 3 Automated Driving System
  language_code: eng
  entry_status: valid
  annotations: []
