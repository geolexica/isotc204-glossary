data:
  definition:
  - content: "<physical view> abstraction of a {{urn:iso:std:iso:14812:ed3:3.1.1.3,material
      entity}} that interacts with other abstract material entities in the provision
      of {{urn:iso:std:iso:14812:ed3:3.5.3.1,ITS services}}"
  notes:
  - content: Physical objects are represented as {{urn:iso:std:iso:14812:ed3:3.1.3.10,elements}}
      within the {{urn:iso:std:iso:14812:ed3:3.1.4.7,physical view}} and perform a
      role. Physical objects can be implemented as cloud-based {{urn:iso:std:iso:14812:ed3:3.1.2.1,systems}}.
  - content: 'Within many ITS reference architectures (ITS reference architecture.md),
      physical objects are placed into one of five categories: centre, support, field,
      vehicle or {{urn:iso:std:iso:14812:ed3:3.6.1.1,traveller}}.'
  terms:
  - type: expression
    normative_status: preferred
    designation: physical object
  - type: expression
    normative_status: admitted
    designation: ITS physical object
