  definition:
  - content: |-
      {{urn:iso:std:iso:14812:ed3:3.4.1.2,spatial location}} enclosed within a two-dimensional boundary or boundaries across a defined surface
      <img alt="area location Diagram" src="../../diagrams/area location.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      EXAMPLE: The British Isles.
      ---
      Comment on this page
