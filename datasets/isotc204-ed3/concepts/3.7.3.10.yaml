  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.7.3.6,driving automation system}} that
      is able to perform the entire {{urn:iso:std:iso:14812:ed3:3.7.3.1,dynamic driving
      task}} on a sustained basis"
  notes:
