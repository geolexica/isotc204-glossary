data:
  definition:
  - content: "{{urn:iso:std:iso:14812:ed3:3.2.3.2,ITS roadside equipment}} that perform
      {{urn:iso:std:iso:14812:ed3:3.5.3.1,ITS services}} by exchanging electronic
      {{urn:iso:std:iso:14812:ed3:3.1.11.5,messages}} with nearby {{urn:iso:std:iso:14812:ed3:3.2.3.7,connected
      vehicles}} and/or {{urn:iso:std:iso:14812:ed3:3.2.1.3,personal systems}} via
      short-range wireless technologies"
  notes:
  - content: Connected roadside equipment typically provides ITS-related functionality
      but the term includes roadside equipment that only provide the ITS service of
      routing for short-range wireless technologies.
  - content: The term "connected vehicle roadside equipment" is used within the current
      version of the Architecture Reference for Cooperative and Intelligent Transportation
      (ARC-IT; see Reference [25]).
  terms:
  - type: expression
    normative_status: preferred
    designation: connected vehicle roadside equipment
  - type: expression
    normative_status: admitted
    designation: CV-RSE
  language_code: eng
  entry_status: valid
  annotations: []
