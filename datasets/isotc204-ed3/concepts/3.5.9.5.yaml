data:
  definition:
  - content: |-
      <transport service> {{urn:iso:std:iso:14812:ed3:3.5.9.3,concurrent}} operation where transported items can only be received or delivered at stopping points within a pre-defined {{urn:iso:std:iso:14812:ed3:3.5.1.1,service}} corridor
      <img alt="dynamic route Diagram" src="../../diagrams/dynamic route.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      EXAMPLE: Airport shuttle.
      ---
      Comment on this page
  notes:
  - content: The service corridor is defined by the provider, who may impose further
      restrictions on where stops are allowed.
  - content: The service corridor often includes a communal point of interest (e.g.
      an airport, transit hub, etc.) as a fixed stopping point.
  terms:
  - type: expression
    normative_status: preferred
    designation: dynamic route
