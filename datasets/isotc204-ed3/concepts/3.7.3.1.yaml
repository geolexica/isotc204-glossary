data:
  definition:
  - content: |-
      all real-time operational and tactical functions required to operate a {{urn:iso:std:iso:14812:ed3:3.7.1.1,vehicle}} in on-road traffic
      <img alt="dynamic driving task Diagram" src="../../diagrams/dynamic driving task.dot.png" /> <!-- Fallback for non-SVG browsers -->
      </object>
      ---
      Comment on this page
  notes:
  - content: The DDT excludes strategic functions such as trip scheduling and selection
      of destinations and waypoints.
  - content: The DDT includes lateral vehicle motion control, longitudinal vehicle
      motion control, monitoring the driving {{urn:iso:std:iso:14812:ed3:3.1.3.11,environment}},
      object and event response execution, manoeuvre planning and enhancing conspicuity.
  terms:
  - type: expression
    normative_status: preferred
    designation: dynamic driving task
  - type: expression
    normative_status: admitted
    designation: DDT
