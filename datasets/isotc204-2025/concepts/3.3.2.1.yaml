data:
  definition:
  - content: mechanism used to physically separate <i><a href="#id855CC715739D462e9790E893914D8768"><font
      color="#0000ff"><u>carriageways</u></font></a></i> ( carriageway )
  notes:
  - content: Mechanisms include various types of barriers, such as walls, rails, pylons,
      kerbs, and ditches, as well as open, unpaved space. If two streams of traffic
      are only separated by paved space (including any markings and rumble strips),
      they share a common carriageway.
  terms:
  - type: expression
    normative_status: preferred
    designation: physical traffic separator
  language_code: eng
  entry_status: valid
  annotations: []
