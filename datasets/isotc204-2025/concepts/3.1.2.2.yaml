      color="#0000ff"><u>vehicles</u></font></a></i> ( vehicle ) that jointly are
      designed to move <i><a href="#idC941C5B14FFB4aecAA18427AF3D1435A"><font color="#0000ff"><u>material
      entities</u></font></a></i> ( material entity ) from an origin to a destination
