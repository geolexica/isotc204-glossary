data:
  definition:
  - content: <i><a href="#id3A8D97796CC142fa8882F36C623AA755"><font color="#0000ff"><u>spatial
      location</u></font></a></i> ( spatial location ) enclosed within two-dimensional
      boundary/boundaries across a defined surface
  examples:
  - content: British Isles
  notes:
  - content: The boundary may consist of a single (e.g., a circle) or multiple (e.g.,
      the boundaries of city limits) curvilinear lines and might consist of multiple
      enclosed areas.
  terms:
  - type: expression
    normative_status: preferred
    designation: area location
