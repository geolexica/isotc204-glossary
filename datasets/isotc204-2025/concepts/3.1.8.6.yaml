data:
  definition:
  - content: set of related <i><a href="#id6DD0743FF44F4f0e9817C766379AD954"><font
      color="#0000ff"><u>processes</u></font></a></i> ( process ) that are performed
      by a <i><a href="#id8EA65F2D6F6347bf8FF4C5CD35C61C68"><font color="#0000ff"><u>physical
      object</u></font></a></i> ( physical object ) to fulfil aspects of an <i><a
      href="#id4D485872E9EE414e9CE1AB855A03540B"><font color="#0000ff"><u>ITS service</u></font></a></i>
      ( ITS service )
  examples:
  - content: A vehicle OBE might include a "vehicle basic safety" functional object.
  notes:
  - content: The term "module" is used by the European FRAME architecture while the
      Architecture Reference for Cooperative and Intelligent Transportation (ARC-IT)
      uses the term "functional object".
  terms:
  - type: expression
    normative_status: preferred
    designation: functional object
  language_code: eng
  entry_status: valid
