data:
  definition:
  - content: <i><a href="#id3F880EDEBFE84014A43B46167936F4B1"><font color="#0000ff"><u>roadway</u></font></a></i>
      ( roadway ) comprised of more than two <i><a href="#id855CC715739D462e9790E893914D8768"><font
      color="#0000ff"><u>carriageways</u></font></a></i> ( carriageway )
  notes:
  - content: The PIARC term is "multiple carriageway road" and is recognized as a
      preferred term. Per the definitions provided in this document, "dual carriageway
      road segment" is more accurate and is the most preferred term. The term "dual
      carriageway" by itself is not preferred but admitted.
  - content: The separate carriageways are typically designed for separate traffic
      for (often multiple) specific operational reasons, such as direction of travel,
      category of vehicle (e.g., high occupancy vehicle), local versus through travel,
      etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: multiple carriageway road segment
  language_code: eng
  entry_status: valid
  annotations: []
