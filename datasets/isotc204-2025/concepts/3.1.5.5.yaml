data:
  definition:
  - content: '&lt;ITS-S&gt; protocol layer in the <i><a href="#idCAC31494A311430cBB567F2A82C166EC"><font
      color="#0000ff"><u>ITS station reference architecture</u></font></a></i> ( ITS-S
      reference architecture ) containing the open systems interconnect (OSI) session,
      presentation, and application layer protocols'
  notes:
  - content: Within the US, the NTCIP standards call the facilities layer the "application
      layer"; however, as this term is easily confused with both the OSI application
      layer and the application entity, the term should be avoided and qualified when
      used (e.g., OSI application layer).
  terms:
  - type: expression
    normative_status: preferred
    designation: facilities layer
  language_code: eng
  entry_status: valid
