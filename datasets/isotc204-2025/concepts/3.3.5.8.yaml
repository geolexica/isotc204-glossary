data:
  definition:
  - content: <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font color="#0000ff"><u>link</u></font></a></i>
      ( road ) that represents a contiguous length of a <i><a href="#idE86C320F77B445a18BB03478ACD8CBB2"><font
      color="#0000ff"><u>road link</u></font></a></i> ( road link ) characterized
      by the same physical characteristics
  notes:
  - content: The definition of road segments is highly dependent on what characteristics
      are modelled by the implementation. Characteristics that might result in a new
      road segment include addition or subtraction of a lane, a change in roadway
      width, the change of road type (e.g., start/end of a bridge), etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: road segment
  language_code: eng
  entry_status: valid
