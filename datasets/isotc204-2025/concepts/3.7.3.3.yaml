data:
  definition:
  - content: '&lt;driving automation&gt; response by a <i><a href="#idA195A5913A44427f96436DF49EAAC159"><font
      color="#0000ff"><u>person</u></font></a></i> ( person ) to perform the <i><a
      href="#id53381BA7AB7F48d6AED7DBCA2D07E6C9"><font color="#0000ff"><u>DDT</u></font></a></i>
      ( dynamic driving task ) or by an <i><a href="#idE3B6FF9F65A448ffBA3B74876D599814"><font
      color="#0000ff"><u>ADS</u></font></a></i> ( ADS ) to achieve a minimal risk
      condition when the response is triggered upon violation of the defined <i><a
      href="#id4C8C89A0369D455c9FCE6187A7DD62FC"><font color="#0000ff"><u>operational
      design domain</u></font></a></i> ( operational design domain ) constraints or
      in response to a <i><a href="#idF18A70A730734210891943E1C5F988C3"><font color="#0000ff"><u>DDT
      performance-relevant driving automation system failure</u></font></a></i> (
      DDT performance-relevant system failure )'
