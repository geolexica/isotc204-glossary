data:
  definition:
  - content: hardware and software <i><a href="#id9F9DE40282B84b8aAD4F618C7836F09E"><font
      color="#0000ff"><u>system</u></font></a></i> ( system ) that is able to perform
      part or all of the <i><a href="#id53381BA7AB7F48d6AED7DBCA2D07E6C9"><font color="#0000ff"><u>DDT</u></font></a></i>
      ( dynamic driving task ) on a sustained basis
  notes:
  - content: In contrast to this generic term for any level 1-5 system, the specific
      term for a level 3-5 system is "Automated Driving System (ADS)." Given the similarity
      between the generic term, "driving automation system," and the level 3-5-specific
      term, "Automated Driving System," the latter term is intentionally capitalized
      when spelled out and reduced to its acronym, "ADS", as much as possible, while
      "driving automation system" should not be.
  - content: A driving automation system includes any system capable of level 1-5
      driving automation.
  - content: Driving automation levels are defined in ISO/SAE 22736, which is also
      known as SAE J3016.
  - content: Driving automation levels include "level 1 driving automation", "level
      2 driving automation", "level 3 ADS", "level 4 ADS", and "level 5 ADS".
  terms:
  - type: expression
    normative_status: preferred
    designation: driving automation system
  language_code: eng
  entry_status: valid
  annotations: []
