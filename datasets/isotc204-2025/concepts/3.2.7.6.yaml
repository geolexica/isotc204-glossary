data:
  definition:
  - content: <i><a href="#id6593BC0CD60B42fbB46A55ACB3DFB56B"><font color="#0000ff"><u>functionalities</u></font></a></i>
      ( functionality ) in an <i><a href="#id97580DA2960B420cAFA27BD0EAF104FC"><font
      color="#0000ff"><u>ITS-S node</u></font></a></i> ( ITS-S node ) other than the
      functionalities of an <i><a href="#idDBBB2A22A7F04e468238D737A4612729"><font
      color="#0000ff"><u>ITS-S router</u></font></a></i> ( ITS-S router ), ITS-S border
      router, ITS-S mobile router, or an ITS-S gateway
  examples: []
  notes:
  - content: ITS-S border router and ITS-S mobile router are ITS-S routers with added
      functionality, which is why they are separately excluded from the above definition.
  - content: ITS-S border router, ITS-S mobile router, and ITS-S gateway are defined
      in ISO 21217.
  - content: This is a refinement of the original definition contained in ISO 21217.
  terms:
  - type: expression
    normative_status: preferred
    designation: ITS-S host
  language_code: eng
  entry_status: valid
