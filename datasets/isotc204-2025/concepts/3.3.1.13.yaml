data:
  definition:
  - content: portion of <i><a href="#id855CC715739D462e9790E893914D8768"><font color="#0000ff"><u>carriageway</u></font></a></i>
      ( carriageway ) designed to accommodate a single line of moving <i><a href="#idCD96217608B748ad8F85A3F4059FD426"><font
      color="#0000ff"><u>road vehicles</u></font></a></i> ( road vehicle )
  notes:
  - content: A traffic lane might be bi-directional, such as a single lane road, a
      two-way turn/overtaking lane, or a reversible flow lane.
  - content: Some jurisdictions allow supplemental uses of a traffic lane, such as
      multiple motorcycles sharing the width of a traffic lane or allowing a bicycle
      to use the edge of a lane.
  - content: The term "lane" is often used to refer to "traffic lane" when the context
      is known to be traffic.
  terms:
  - type: expression
    normative_status: preferred
    designation: traffic lane
  language_code: eng
  entry_status: valid
