data:
  definition:
  - content: <i><a href="#id5F69F95814304a3991719C6E60838C0A"><font color="#0000ff"><u>transport
      service</u></font></a></i> ( transport service ) that is publicly accessible
      enabling the movement of one or more <i><a href="#idA195A5913A44427f96436DF49EAAC159"><font
      color="#0000ff"><u>persons</u></font></a></i> ( person )
  examples:
  - content: bus, tram, cable car, metro, train, and ferry are examples of public
      transport means for collective use
  - content: publicly accessible shared cars, shared bikes, and shared e-scooters
      are examples of public transport means for shared and individual use
  notes:
  - content: A public transport service can be scheduled or on-demand
  - content: A public transport service is based on the use of publicly accessible
      transport means for collective, shared, or individual use.
  terms:
  - type: expression
    normative_status: preferred
    designation: public transport
  language_code: eng
  entry_status: valid
