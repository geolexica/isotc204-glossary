data:
  definition:
  - content: '&lt;ITS-S&gt; part of the <i><a href="#idCAC31494A311430cBB567F2A82C166EC"><font
      color="#0000ff"><u>ITS station reference architecture</u></font></a></i> ( ITS-S
      reference architecture ) that is responsible for providing ITS-related functionality'
  notes:
  - content: Within the US, the NTCIP standards identify an "information layer" on
      top of the traditional OSI stack; however, the purpose of this layer includes
      both information configuration and functionality. The ITS-S reference architecture
      separates these two roles between the management entity and the application
      entity.
  terms:
  - type: expression
    normative_status: preferred
    designation: application entity
  language_code: eng
  entry_status: valid
  annotations: []
