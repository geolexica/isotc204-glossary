data:
  definition:
  - content: <i><a href="#idDA3B34E1052A42fd993CBD5F6ED740E6"><font color="#0000ff"><u>location</u></font></a></i>
      ( location ) within three-dimensional space
  notes:
  - content: The "location" could be a point (consuming no space) or could consume
      space in one, two, or three dimensions. In any case, the location is identified
      within a larger space.
  - content: Within ITS, locations are typically locations on or near the surface
      of the earth.
  terms:
  - type: expression
    normative_status: preferred
    designation: spatial location
  language_code: eng
  entry_status: valid
