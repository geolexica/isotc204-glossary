data:
  definition:
  - content: electronic <i><a href="#idB06371D38EFC48e299F50E38BFECA3F5"><font color="#0000ff"><u>data
      dictionary</u></font></a></i> ( data dictionary ) that follows precise documented
      rules for the registration and management of stored <i><a href="#id5C989C1352B14d07BB1E631FC7D46F8F"><font
      color="#0000ff"><u>data concepts</u></font></a></i> ( data concept )
  notes:
  - content: The data concept registry contains meta-attributes about data concepts
      in terms of their names and representational forms as well as the semantics
      associated with the data concepts. A data concept registry may contain metadata
      that assists information interchange and re-use, both from the perspective of
      human users and for machine-interpretation of data concepts.
  - content: A data registry typically includes advanced features for adding, retrieving,
      and working with its contents.
  terms:
  - type: expression
    normative_status: preferred
    designation: data concept registry
