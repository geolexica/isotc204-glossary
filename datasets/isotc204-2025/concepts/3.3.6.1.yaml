data:
  definition:
  - content: space where two or more <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font
      color="#0000ff"><u>roads</u></font></a></i> ( road ) meet or cross
  notes:
  - content: Intersections can be associated with zero junctions, such as a motorway
      crossing a road without any connecting ramps, or can be associated with multiple
      junctions, such as a diamond interchange.
  - content: Complex intersections can be viewed as multiple intersections by providing
      separate designations for distinct road links. For example, one model could
      depict a complex intersection as being associated with multiple junctions; another
      model could depict the same physical infrastructure as being multiple intersections
      that are interconnected by different roads, each with its own designator (e.g.,
      "ramp from northbound Road A to eastbound Road B").
  terms:
  - type: expression
    normative_status: preferred
    designation: intersection
  language_code: eng
  entry_status: valid
  annotations: []
