data:
  definition:
  - content: part of the surface of the <i><a href="#idF9F0ACCE2D49434a803C0D87211F753A"><font
      color="#0000ff"><u>road reservation</u></font></a></i> ( road reservation )
      primarily designed for the movement of <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font
      color="#0000ff"><u>vehicles</u></font></a></i> ( vehicle ) that comply with
      a specified set of requirements
  notes:
  - content: A roadway is characterized using a cross-section of a road facility as
      the roadway characteristics often change along the length of the road. See "road",
      "road section", "road segment", and "road link" for different types of stretches
      of roadway.
  - content: In practice, the roadway design considers a variety of issues, which
      might result in suboptimal road segments that violate normal design guidelines.
      Such locations are typically posted with warning signs, but they are still "designed
      for the movement of vehicles."
  - content: The roadway includes any contiguous hard shoulders, hardstanding, and
      reserved lanes.
  - content: While the roadway is designed with certain vehicle characteristics in
      mind, local regulations typically allow a wider set of vehicles to use the roadway.
  terms:
  - type: expression
    normative_status: preferred
    designation: roadway
  language_code: eng
  entry_status: valid
  annotations: []
