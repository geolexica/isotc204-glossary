data:
  definition:
  - content: malfunction in a vehicle system that prevents the <i><a href="#id65AFD85E052043b0AB87514248666FFA"><font
      color="#0000ff"><u>driving automation system</u></font></a></i> ( driving automation
      system ) from reliably performing its portion of the <i><a href="#id53381BA7AB7F48d6AED7DBCA2D07E6C9"><font
      color="#0000ff"><u>DDT</u></font></a></i> ( dynamic driving task ) on a sustained
      basis
  examples: []
  notes:
  - content: The malfunction may be internal to the driving automation system or part
      of another vehicle system.
  terms:
  - type: expression
    normative_status: preferred
    designation: DDT performance-relevant system failure
  language_code: eng
  entry_status: valid
