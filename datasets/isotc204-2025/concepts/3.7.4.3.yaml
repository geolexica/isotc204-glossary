data:
  definition:
  - content: characteristic of a <i><a href="#idC941C5B14FFB4aecAA18427AF3D1435A"><font
      color="#0000ff"><u>material entity</u></font></a></i> ( material entity ) that
      is<font color="#313131"> or was equipped with communications equipment </font>that
      is sufficiently physically disconnected such that the vehicle is no longer able
      to send data to or receive data from <i><a href="#id49FF108A0CA140d49A439CF9BBABA1BB"><font
      color="#0000ff"><u>connected</u></font></a></i> ( connected ) entities
  notes:
  - content: The vehicle on-board equipment might still be present in the vehicle
      and might even be partially connected, but not in any operational sense.
  terms:
  - type: expression
    normative_status: preferred
    designation: disconnected
  language_code: eng
  entry_status: valid
