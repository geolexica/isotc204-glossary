data:
  definition:
  - content: '&lt;vehicle&gt; maximum <i><a href="#idCDB8A094578846dcB02F79FBE507F07D"><font
      color="#0000ff"><u>speed</u></font></a></i> ( speed ) at which a <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font
      color="#0000ff"><u>vehicle</u></font></a></i> ( vehicle ) is intended to operate
      for a sustained period of time'
  examples: []
  notes:
  - content: The term "top speed" is defined in SAE J3194:2019 in relation to powered
      micromobility vehicles and is considered to be semantically equivalent to design
      speed.
  terms:
  - type: expression
    normative_status: preferred
    designation: design speed
  language_code: eng
  entry_status: valid
