data:
  definition:
  - content: infrastructure primarily designed for the use of cycles and separate
      from a <i><a href="#id855CC715739D462e9790E893914D8768"><font color="#0000ff"><u>carriageway</u></font></a></i>
      ( carriageway )
  notes:
  - content: Local legislation might allow cycleways to be used by a variety of low-speed
      vehicles (e.g., low-speed scooters, skateboards, etc.) and might share usage
      of other low-speed modes such as pedestrians, horseback riders, etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: cycleway
