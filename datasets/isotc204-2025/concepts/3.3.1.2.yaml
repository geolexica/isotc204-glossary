data:
  definition:
  - content: area legally reserved for road transport purposes and support
  notes:
  - content: Support includes physical equipment such as safety devices, signage,
      and controller cabinets as well as access by maintenance vehicles and personnel.
  - content: The road reservation includes all carriageways as well as width to allow
      for roadside devices, shoulders, verges, footways, drainage facilities, sound
      walls, slopes, embankments,  etc.
