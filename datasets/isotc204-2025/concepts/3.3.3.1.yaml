data:
  definition:
  - content: <i><a href="#idDAF8D75AA574422cADE5F6D094406BB4"><font color="#0000ff"><u>lane</u></font></a></i>
      ( lane ) designed for the through movement of cycles
  examples: []
  notes:
  - content: Cycle lanes are typically much narrower than traffic lanes.
  - content: Cycle lanes are typically part of either a carriageway or a cycleway.
  - content: Cycle lanes could also allow and be designed for motorized vehicles (e.g.,
      e-scooters, mopeds, etc.) with similar performance characteristics as human-powered
      cycles, subject to local regulations.
  terms:
  - type: expression
    normative_status: preferred
    designation: cycle lane
  language_code: eng
  entry_status: valid
