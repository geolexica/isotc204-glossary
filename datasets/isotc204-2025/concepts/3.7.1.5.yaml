data:
  definition:
  - content: <i><a href="#idD912A6773D214e72BEC85F0D9A4529FA"><font color="#0000ff"><u>input
      device</u></font></a></i> ( input device ) designed to be physically connected
      to a <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font color="#0000ff"><u>vehicle</u></font></a></i>
      ( vehicle ) and to remain connected even when the vehicle is not in use
  examples: []
  notes:
  - content: Built-in input devices are typically considered to be a part of the vehicle.
  - content: Built-in input devices include devices that might be temporarily disconnected
      for security reasons (e.g., some radios are equipped with detachable front panels).
  - content: Built-in input devices require a maintenance operation to connect or
      disconnect.
  terms:
  - type: expression
    normative_status: preferred
    designation: built-in vehicle input device
  language_code: eng
  entry_status: valid
