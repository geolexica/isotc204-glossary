data:
  definition:
  - content: description of a <i><a href="#id3A8D97796CC142fa8882F36C623AA755"><font
      color="#0000ff"><u>spatial location</u></font></a></i> ( spatial location )
      in the real world according to a defined reference system
  examples:
  - content: 'Coordinate tuple: 51.476852, -0.000500'
  notes:
  - content: The rules need not be formal coordinates but could be descriptive.
  - content: The term "location reference" has been used within ITS, but the term
      "spatial reference" is preferred to better align with activities of ISO/TC 211.
  terms:
  - type: expression
    normative_status: preferred
    designation: spatial reference
  language_code: eng
  entry_status: valid
