  definition:
  - content: aggregation of one or more <i><a href="#idE86C320F77B445a18BB03478ACD8CBB2"><font
      color="#0000ff"><u>road links</u></font></a></i> ( road link ) that represents
      a contiguous length of a <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font
      color="#0000ff"><u>road</u></font></a></i> ( road ) that shares the same management
      and operational strategies
  examples:
  - content: A traffic signal timing plan is applied to one road section.
  notes:
