data:
  definition:
  - content: all real-time operational and tactical functions required to operate
      a <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font color="#0000ff"><u>vehicle</u></font></a></i>
      ( vehicle ) in on-road traffic
  notes:
  - content: The DDT includes lateral vehicle motion control, longitudinal vehicle
      motion control, monitoring the driving environment, object and event response
      execution, manoeuvre planning, and enhancing conspicuity.
  - content: The DDT excludes strategic functions such as trip scheduling and selection
      of destinations and waypoints.
  terms:
  - type: expression
    normative_status: preferred
    designation: dynamic driving task
  language_code: eng
  entry_status: valid
  annotations: []
