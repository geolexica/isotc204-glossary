data:
  definition:
  - content: <i><a href="#idB67B240E827E493eB1532275FAFAB9BE"><font color="#0000ff"><u>driver
      support system</u></font></a></i> ( driver spport system ) that provides either
      sustained lateral or sustained longitudinal vehicle motion control within a
      specific <i><a href="#id4C8C89A0369D455c9FCE6187A7DD62FC"><font color="#0000ff"><u>operational
      design domain</u></font></a></i> ( operational design domain ) with the expectation
      that a <i><a href="#id76D23D03F3624a68920FB5BE7FB40ED8"><font color="#0000ff"><u>conventional
      driver</u></font></a></i> ( in-vehicle driver ) completes the dynamic driving
      task
  examples: []
  notes:
  - content: Other driving automation levels include "level 2 driving automation",
      "level 3 ADS", "level 4 ADS", and "level 5 ADS".
  terms:
  - type: expression
    normative_status: preferred
    designation: level 1 driving automation
  language_code: eng
  entry_status: valid
