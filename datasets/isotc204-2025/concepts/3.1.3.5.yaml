data:
  definition:
  - content: '&lt;system&gt; interest in a <i><a href="#id9F9DE40282B84b8aAD4F618C7836F09E"><font
      color="#0000ff"><u>system</u></font></a></i> ( system ) relevant to one or more
      of its <i><a href="#id730A631B2F0A43c2870FF7EC89013DA2"><font color="#0000ff"><u>stakeholders</u></font></a></i>
      ( stakeholder )'
  examples: []
  notes:
  - content: A concern pertains to any influence on a system in its environment, including
      developmental, technological, business, operational, organizational, political,
      economic, legal, regulatory, ecological and social influences.
