data:
  definition:
  - content: characteristic of a <i><a href="#id1C9A28E75C534b08939F72CA1207904D"><font
      color="#0000ff"><u>financial model</u></font></a></i> ( financial model ) that
      requires <i><a href="#id8B698530E3B946b3B78C2E6C58FE87D7"><font color="#0000ff"><u>users</u></font></a></i>
      ( user ) to enter into an agreement prior to receiving <i><a href="#id1C826F4DC7744eb7B8DDB33EF68A28F5"><font
      color="#0000ff"><u>services</u></font></a></i> ( service )
  notes:
  - content: The agreement might be associated with fees.
  - content: The agreement might be minimal, such as collecting user information for
      business purposes.
  - content: The membership may be granted as a part of a broader agreement. For example,
      a university bus system might restrict access to students and faculty.
  terms:
  - type: expression
    normative_status: preferred
    designation: membership-based
  language_code: eng
  entry_status: valid
  annotations: []
