  definition:
  - content: <i><a href="#id0F23B7B6B1C64d828035A246CDCC780C"><font color="#0000ff"><u>spatial
      reference</u></font></a></i> ( spatial reference ) in the form of a label or
      code
  examples:
  - content: '"Spain" is an example of a label (country name); "SW1P 3AD" is an example
      of a code (postcode).'
  notes:
  - content: The term "location code" has been used previously in ISO/TC 204 standards,
      but "geographic identifier" is preferred to be more consistent with ISO/TC 211
      work.
