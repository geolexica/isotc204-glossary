data:
  definition:
  - content: <i><a href="#id3F880EDEBFE84014A43B46167936F4B1"><font color="#0000ff"><u>roadway</u></font></a></i>
      ( roadway ) comprised of exactly two <i><a href="#id855CC715739D462e9790E893914D8768"><font
      color="#0000ff"><u>carriageways</u></font></a></i> ( carriageway )
  notes:
  - content: The PIARC term is "dual carriageway road" and is recognized as a preferred
      term. Per the definitions provided in this document, "dual carriageway road
      segment" is more accurate and is the most preferred term. The term "dual carriageway"
      by itself is not preferred but admitted.
  - content: The term "divided highway" is the equivalent American English term.
  - content: The two carriageways are typically designed for travel in opposite directions.
  terms:
  - type: expression
    normative_status: preferred
    designation: dual carriageway road segment
  language_code: eng
  entry_status: valid
  annotations: []
