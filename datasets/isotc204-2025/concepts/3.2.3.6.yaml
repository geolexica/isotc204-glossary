data:
  definition:
  - content: characteristic of a <i><a href="#idC941C5B14FFB4aecAA18427AF3D1435A"><font
      color="#0000ff"><u>material entity</u></font></a></i> ( material entity ) that
      is equipped with enabled (i.e., on) and operational electronic communication
      technologies to support ITS services, including the means to send and receive
      data to and from other connected entities
  examples: []
  notes:
  - content: The term "connected" does not imply support for any specific communications
      interface or ITS-S application process.
  terms:
  - type: expression
    normative_status: preferred
    designation: connected
  language_code: eng
  entry_status: valid
