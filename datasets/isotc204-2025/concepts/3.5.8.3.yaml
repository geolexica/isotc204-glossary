data:
  definition:
  - content: <i><a href="#id1C9A28E75C534b08939F72CA1207904D"><font color="#0000ff"><u>financial
      model</u></font></a></i> ( financial model ) where <i><a href="#id1C826F4DC7744eb7B8DDB33EF68A28F5"><font
      color="#0000ff"><u>services</u></font></a></i> ( service ) are provided by an
      administrative authority in an attempt to better serve societal interests
  notes:
  - content: The transport service is typically offered to the transport consumer
      for less than the full capital and operating cost of providing the service,
      but this is not a requirement.
  - content: Typically, the administrative authority is a local government agency;
      but it could be another administrative authority, such as the national government
      or a commercial entity managing transport needs on their campus.
  terms:
  - type: expression
    normative_status: preferred
    designation: public
  language_code: eng
  entry_status: valid
  annotations: []
