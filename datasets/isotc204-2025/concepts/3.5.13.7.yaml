data:
  definition:
  - content: <i><a href="#id1C90ED2B61D74f899D6D199CB9A2B785"><font color="#0000ff"><u>mobility
      app</u></font></a></i> ( mobility app ) that assists a <i><a href="#idE444860D95E5458a9BA4CF4BCE3EAD71"><font
      color="#0000ff"><u>transport user</u></font></a></i> ( transport user ) in using
      a <i><a href="#id8D4AD407A8594d13A4947E6EA66408A6"><font color="#0000ff"><u>public
      transport</u></font></a></i> ( public transport ) system
  notes:
  - content: A public transport app might include features such as viewing maps, searching
      routes and schedules, real-time arrival information, ticketing, electronic boarding
      pass, etc.
  terms:
  - type: expression
    normative_status: preferred
    designation: public transport app
