data:
  definition:
  - content: set of operating conditions under which a given <i><a href="#id65AFD85E052043b0AB87514248666FFA"><font
      color="#0000ff"><u>driving automation system</u></font></a></i> ( driving automation
      system ) or feature thereof is specifically designed to function
  examples:
  - content: ADS feature designed to operate a vehicle only on fully access-controlled
      freeways in low-speed traffic, under fair weather conditions and optimal road
      maintenance conditions (e.g., good lane markings and not under construction).
  - content: ADS-dedicated vehicle designed to operate only within a geographically-defined
      area, and only during daylight at speeds not to exceed 25 mph.
  notes:
  - content: The conditions might include environmental, geographical, time-of-day,
      and/or other restrictions.
  - content: The conditions might require the presence or absence of certain traffic
      or roadway characteristics.
  terms:
  - type: expression
    normative_status: preferred
    designation: operational design domain
  language_code: eng
  entry_status: valid
  annotations: []
