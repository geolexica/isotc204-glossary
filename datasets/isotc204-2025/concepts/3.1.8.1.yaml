data:
  definition:
  - content: '&lt;physical view&gt; abstraction of a <i><a href="#idC941C5B14FFB4aecAA18427AF3D1435A"><font
      color="#0000ff"><u>material entity</u></font></a></i> ( material entity ) that
      interacts with other abstract material entities in the provision of <i><a href="#id4D485872E9EE414e9CE1AB855A03540B"><font
      color="#0000ff"><u>ITS services</u></font></a></i> ( ITS service )'
  notes:
  - content: Physical objects are represented as elements within the physical view
      and perform a role. Physical objects can be implemented as cloud-based systems.
  - content: 'Within many ITS reference architectures, physical objects are placed
      into one of five categories: centre, support, field, vehicle, or traveller.'
  terms:
  - type: expression
    normative_status: preferred
    designation: physical object
  language_code: eng
  entry_status: valid
  annotations: []
