data:
  definition:
  - content: <i><a href="#idAF252202FB50473fB51E56F3FBE6932E"><font color="#0000ff"><u>shared
      transport service</u></font></a></i> ( shared transport service ) that transports
      passengers between two specified <i><a href="#id3A8D97796CC142fa8882F36C623AA755"><font
      color="#0000ff"><u>locations</u></font></a></i> ( spatial location )
  examples: []
  notes:
  - content: Each location might be defined as point, linear, or area locations; however,
      the areas of the two locations should not overlap.
  terms:
  - type: expression
    normative_status: preferred
    designation: shuttle service
  language_code: eng
  entry_status: valid
