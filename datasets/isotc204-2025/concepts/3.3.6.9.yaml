data:
  definition:
  - content: <i><a href="#id6C52075FBEAD42d4B0FB9C8A7F8FD833"><font color="#0000ff"><u>junction</u></font></a></i>
      ( junction ) with at least one <i><a href="#idCEAE137FA7454a6c955DD7B7F50538E2"><font
      color="#0000ff"><u>grade separated manoeuvre</u></font></a></i> ( grade separated
      manoeuvre )
  notes:
  - content: The grade separation allows travellers on the link to pass unimpeded
      through the interchange when congestion is not present.
  - content: The term "interchange" typically refers to the facilities that enable
      all available manoeuvres at the grade-separated intersection, which typically
      includes multiple junctions.
  terms:
  - type: expression
    normative_status: preferred
    designation: interchange
  language_code: eng
  entry_status: valid
