data:
  definition:
  - content: <i><a href="#id99035FCBCBED4af49063EB3F85FD7031"><font color="#0000ff"><u>driver</u></font></a></i>
      ( driver ) that performs the <i><a href="#id53381BA7AB7F48d6AED7DBCA2D07E6C9"><font
      color="#0000ff"><u>dynamic driving task</u></font></a></i> ( dynamic driving
      task ) without using the vehicle's <i><a href="#id9FA5E7B96F34461bAF17E2FB61512F95"><font
      color="#0000ff"><u>built-in input devices</u></font></a></i> ( built-in vehicle
      input device ) to control the longitudinal and lateral movement of the vehicle
  notes:
  - content: A remote driver may use a variety of physical input devices, but not
      any that are built into the vehicle.
  terms:
  - type: expression
    normative_status: preferred
    designation: remote driver
