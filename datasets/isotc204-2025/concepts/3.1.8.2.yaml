data:
  definition:
  - content: <i><a href="#id3783095C41E041c8B0CC1813CBCAEE44"><font color="#0000ff"><u>physical
      object</u></font></a></i> ( ITS component ) that has been assigned one or more
      <i><a href="#idEC65B14A2BF845deBCC48632F635C9FF"><font color="#0000ff"><u>functional
      objects</u></font></a></i> ( functional object ) in the provision of one or
      more <i><a href="#id4D485872E9EE414e9CE1AB855A03540B"><font color="#0000ff"><u>ITS
      services</u></font></a></i> ( ITS service )
  notes:
  - content: Physical objects are ITS components if they are an integral part of the
      system; otherwise they are terminators.
