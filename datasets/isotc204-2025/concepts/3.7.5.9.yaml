  definition:
  - content: speed of a <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font color="#0000ff"><u>vehicle</u></font></a></i>
      ( vehicle ) that exceeds speeds typical of pedal cycles but can be reached on
      performance pedal cycles in short bursts or by performance riders
  examples:
  - content: SAE J3194:2019 associates this with a top speed in the range between
      32 km/h and 48 km/h.
  notes:
  - content: Local regulations for the exact speed range vary.
  terms:
  - type: expression
    normative_status: preferred
    designation: moderately low vehicle speed
