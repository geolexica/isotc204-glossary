data:
  definition:
  - content: <i><a href="#id65AFD85E052043b0AB87514248666FFA"><font color="#0000ff"><u>driving
      automation system</u></font></a></i> ( driving automation system ) that is able
      to perform the entire <i><a href="#id53381BA7AB7F48d6AED7DBCA2D07E6C9"><font
      color="#0000ff"><u>DDT</u></font></a></i> ( dynamic driving task ) on a sustained
      basis
  examples: []
  notes:
  - content: The abbreviated form ("ADS") is the most preferred form and the alternate
      form ("Automated Driving System") uses initial capitals to avoid confusion with
      the more general "driving automation system".
  terms:
  - type: expression
    normative_status: preferred
    designation: ADS
  language_code: eng
  entry_status: valid
