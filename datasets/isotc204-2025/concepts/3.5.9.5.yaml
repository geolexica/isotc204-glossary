data:
  definition:
  - content: '&lt;transport service&gt; <i><a href="#idE5D76E7905404edfBA6A94FCEC721A6A"><font
      color="#0000ff"><u>concurrent</u></font></a></i> ( concurrent ) operation where
      transported items can only be received or delivered at stopping points within
      a pre-defined service corridor'
  examples:
  - content: Airport shuttle
  notes:
  - content: The service corridor is defined by the provider, who may impose further
      restrictions on where stops are allowed.
  - content: The service corridor often includes a communal point of interest (e.g.,
      an airport, transit hub, etc) as a fixed stopping point.
  terms:
  - type: expression
    normative_status: preferred
    designation: dynamic route
  language_code: eng
  entry_status: valid
  annotations: []
