data:
  definition:
  - content: <i><a href="#idD912A6773D214e72BEC85F0D9A4529FA"><font color="#0000ff"><u>input
      device</u></font></a></i> ( input device ) capable to be carried into, or in
      near proximity of, a <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font
      color="#0000ff"><u>vehicle</u></font></a></i> ( vehicle ) and connected as desired
  examples:
  - content: A smartphone connected to a vehicle (via USB or Bluetooth) to provide
      driver navigation on the vehicle's large screen display
  notes:
  - content: Nomadic devices are often more closely associated with a person than
      they are with the vehicle.
  - content: Nomadic input devices do not require a maintenance operation to connect
      or disconnect.
  terms:
  - type: expression
    normative_status: preferred
    designation: nomadic vehicle input device
  language_code: eng
  entry_status: valid
  annotations: []
