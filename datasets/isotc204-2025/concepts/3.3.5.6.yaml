data:
  definition:
  - content: <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font color="#0000ff"><u>link</u></font></a></i>
      ( road ) representing a contiguous length of a <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font
      color="#0000ff"><u>road</u></font></a></i> ( road ) between two <i><a href="#id32DA2E8F5F69415a9D62BD51CF4FAC92"><font
      color="#0000ff"><u>nodes</u></font></a></i> ( node ) of operational or managerial
      significance
  notes:
  - content: The operational characteristics of the nodes would relate to the type
      of road model. For example, a traffic system might base its road links on nodes
      that represent junctions and road terminators.
  terms:
  - type: expression
    normative_status: preferred
    designation: road link
  language_code: eng
  entry_status: valid
  annotations: []
