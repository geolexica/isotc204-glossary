data:
  definition:
  - content: <i><a href="#idE3B6FF9F65A448ffBA3B74876D599814"><font color="#0000ff"><u>ADS</u></font></a></i>
      ( ADS ) designed with the expectation that the <i><a href="#id4B4E9E64261E4f09B7F7579C8389B23F"><font
      color="#0000ff"><u>fallback-ready user</u></font></a></i> ( fallback-ready user
      ) is available to intervene
  notes:
  - content: Level 3 ADSs are restricted to operating within a specific ODD.
  - content: Other driving automation levels include "level 1 driving automation",
      "level 2 driving automation", "level 4 ADS", and "level 5 ADS".
  - content: The user might need to intervene due to an ADS-issued request, a DDT
      performance-relevant system failure, or other reasons.
  terms:
  - type: expression
    normative_status: preferred
    designation: level 3 ADS
  language_code: eng
  entry_status: valid
  annotations: []
