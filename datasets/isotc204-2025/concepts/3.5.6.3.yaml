data:
  definition:
  - content: <i><a href="#id5F69F95814304a3991719C6E60838C0A"><font color="#0000ff"><u>transport
      service</u></font></a></i> ( transport service ) that sequentially provides
      the same <i><a href="#id555BFAB2A747457fB01D99511FDE885A"><font color="#0000ff"><u>vehicles</u></font></a></i>
      ( vehicle ) to multiple unrelated <i><a href="#idE444860D95E5458a9BA4CF4BCE3EAD71"><font
      color="#0000ff"><u>transport users</u></font></a></i> ( transport user ) and
      where the transport user has the primary responsibility for the operation of
      the vehicle
  notes:
  - content: As there should only be one operator of a vehicle at any time, a shared
      vehicle service should use a sequential operational model.
  - content: This term can be specialized by replacing "vehicle" with any defined
      vehicle type (e.g., "automated vehicle sharing").
  terms:
  - type: expression
    normative_status: preferred
    designation: shared vehicle service
  language_code: eng
  entry_status: valid
  annotations: []
