data:
  definition:
  - content: <i><a href="#id3F880EDEBFE84014A43B46167936F4B1"><font color="#0000ff"><u>roadway</u></font></a></i>
      ( roadway ) comprised of exactly one <i><a href="#id855CC715739D462e9790E893914D8768"><font
      color="#0000ff"><u>carriageway</u></font></a></i> ( carriageway )
  examples: []
  notes:
  - content: The PIARC term is "single carriageway road" and is recognized as a preferred
      term. Per the definitions provided in this document, "single carriageway road
      segment" is more accurate and is the most preferred term. The term "single carriageway"
      by itself is not preferred but admitted.
  - content: A single carriageway road segment could have multiple lanes and could
      allow travel in opposite directions
  - content: The term "undivided highway" is the equivalent American English term.
  terms:
  - type: expression
    normative_status: preferred
    designation: single carriageway road segment
  language_code: eng
  entry_status: valid
