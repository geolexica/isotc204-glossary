data:
  definition:
  - content: <i><a href="#idE3B6FF9F65A448ffBA3B74876D599814"><font color="#0000ff"><u>ADS</u></font></a></i>
      ( ADS ) that is capable of unconditional (i.e., not <i><a href="#id4C8C89A0369D455c9FCE6187A7DD62FC"><font
      color="#0000ff"><u>ODD</u></font></a></i> ( operational design domain )-specific)
      operation and providing its own <i><a href="#idDA84A3AE849442be8F2BEDE52CBDB60C"><font
      color="#0000ff"><u>fallback</u></font></a></i> ( fallback ), without any expectation
      that a human <i><a href="#id99035FCBCBED4af49063EB3F85FD7031"><font color="#0000ff"><u>driver</u></font></a></i>
      ( driver ) will respond to a request to intervene
  notes:
  - content: Other driving automation levels include "level 1 driving automation",
      "level 2 driving automation", "level 3 ADS", and "level 4 ADS".
  terms:
  - type: expression
    normative_status: preferred
    designation: level 5 ADS
  language_code: eng
  entry_status: valid
