data:
  definition:
  - content: contiguous area of <i><a href="#id3F880EDEBFE84014A43B46167936F4B1"><font
      color="#0000ff"><u>roadway</u></font></a></i> ( roadway ) along a <i><a href="#idC615C2E3B7124c83B83FE649EAF6AD04"><font
      color="#0000ff"><u>road segment</u></font></a></i> ( road segment )
  notes:
  - content: A carriageway is comprised of one or more traffic lanes (i.e., the travelled
      way) and could include shoulders and lay-bys.
  - content: Carriageways are separated by physical traffic separators.
  - content: When looking at a cross-section of the road reservation, the driving
      space consists of all of the carriageways.
  terms:
  - type: expression
    normative_status: preferred
    designation: carriageway
  language_code: eng
  entry_status: valid
