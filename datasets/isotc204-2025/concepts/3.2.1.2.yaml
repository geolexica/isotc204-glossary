data:
  definition:
  - content: infrastructure-based <i><a href="#id3783095C41E041c8B0CC1813CBCAEE44"><font
      color="#0000ff"><u>ITS component</u></font></a></i> ( ITS component ) located
      outside of a data centre that is designed to provide local processing or routing
      services while stationary
  examples:
  - content: traffic detector, camera, signal controller, message sign, tolling station
  notes:
  - content: Field systems can be permanently installed or transportable.
  - content: The term "roadside system" is typically used to describe field systems
      along a roadside but can also be used to refer to kiosks and any other systems.
  - content: Typically, field systems are located along the roadside.
  - content: Typically, the operation of a field system is governed by management
      functions running in a centre system.
  terms:
  - type: expression
    normative_status: preferred
    designation: field system
  language_code: eng
  entry_status: valid
  annotations: []
