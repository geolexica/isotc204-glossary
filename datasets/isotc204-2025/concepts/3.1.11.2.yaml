data:
  definition:
  - content: set of ideas, abstractions or things in the real world that are identified
      with explicit boundaries and meaning and whose properties and behaviour follow
      the same rules
  notes:
  - content: Some TC 204 standards use the term "object class" for consistency with
      ISO 11179-1, but within ITS, the term "class" is more generally understood.
  - content: This is semantically equivalent to a "class" as used within UML(ISO19505-2:2012).
  sources:
  - origin:
      ref:
        source: ISO/IEC 11179-1:2015, 3.3.18, term changed to "class" and notes added
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: class
