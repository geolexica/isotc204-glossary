data:
  definition:
  - content: <i><a href="#id947856123B8C483fA4EA168B5D71D241"><font color="#0000ff"><u>physical
      traffic separator</u></font></a></i> ( physical traffic separator ) that consists
      of a wall with a wide, sloped base designed to divert vehicles back into their
      <i><a href="#id1240152ED5B6429eA0A4B380F1D798E4"><font color="#0000ff"><u>traffic
      lane</u></font></a></i> ( traffic lane )
  examples: []
  notes:
  - content: Jersey barriers are typically modular. They are typically made of concrete
      but can also be made with other materials such as plastic filled with water
      or sand.
  terms:
  - type: expression
    normative_status: preferred
    designation: Jersey barrier
  language_code: eng
  entry_status: valid
