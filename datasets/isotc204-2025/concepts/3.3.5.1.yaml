data:
  definition:
  - content: curvilinear length of <i><a href="#id3F880EDEBFE84014A43B46167936F4B1"><font
      color="#0000ff"><u>roadway</u></font></a></i> ( roadway ) that shares the same
      identification
  examples: []
  notes:
  - content: A length of the road network may be referenced by multiple designators
      (e.g., Main Street and Route 7). In this case, there would be two "roads" that
      share the same set of "carriageways".
  - content: A road can change directions at a junction.
  - content: The identification is generally a name or number.
  terms:
  - type: expression
    normative_status: preferred
    designation: road
  language_code: eng
