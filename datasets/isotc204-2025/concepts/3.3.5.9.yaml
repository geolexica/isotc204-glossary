data:
  definition:
  - content: <i><a href="#id72937CE094414775B90C995DFCB64EEB"><font color="#0000ff"><u>link</u></font></a></i>
      ( road ) that represents a lane of a <i><a href="#idE86C320F77B445a18BB03478ACD8CBB2"><font
      color="#0000ff"><u>road link</u></font></a></i> ( road link )
  notes:
  - content: A lane segment might start or end at locations other than the start or
      end of the corresponding road segment (e.g., a lane may start mid-block).
  - content: A lane segment only includes the sequential lane links, it does not include
      lane links from adjacent lanes.
  terms:
  - type: expression
    normative_status: preferred
    designation: lane link
