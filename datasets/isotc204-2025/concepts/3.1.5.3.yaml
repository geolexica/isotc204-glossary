data:
  definition:
  - content: '&lt;ITS-S&gt; protocol layer in the <i><a href="#idCAC31494A311430cBB567F2A82C166EC"><font
      color="#0000ff"><u>ITS station reference architecture</u></font></a></i> ( ITS-S
      reference architecture ) containing the open systems interconnect (OSI) physical
      and data link layer protocols for ITS communications'
  notes:
  - content: Within the IETF, the term "link layer" is used to describe the same functionality
      as the ITS-S access layer.
  - content: Within the US, the NTCIP standards use the term "subnet layer" to describe
      the same functionality as the ITS-S access layer.
  terms:
  - type: expression
    normative_status: preferred
    designation: ITS-S access layer
  language_code: eng
  entry_status: valid
