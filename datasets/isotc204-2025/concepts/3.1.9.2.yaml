data:
  definition:
  - content: <i><a href="#id1977CCC04EA948719638C89546E52E47"><font color="#0000ff"><u>architecture</u></font></a></i>
      ( architecture ) that provides a long-term vision of <i><a href="#idA9454DB86F4C47c9902B7ABEE2462EA8"><font
      color="#0000ff"><u>system elements</u></font></a></i> ( element ) that may be
      deployed and managed by different projects and/or entities within a geographic
      area
  notes:
  - content: Some countries use the term "regional architecture", but in international
      standards, the term "regional" is avoided due to its multiple meanings.
  terms:
  - type: expression
    normative_status: preferred
    designation: planning architecture
