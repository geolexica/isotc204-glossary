data:
  definition:
  - content: '&lt;transport service&gt; <i><a href="#idE5D76E7905404edfBA6A94FCEC721A6A"><font
      color="#0000ff"><u>concurrent</u></font></a></i> ( concurrent ) operation where
      the <i><a href="#idA3BC9C78F77A4be7BADD00079FED8167"><font color="#0000ff"><u>transport
      provider</u></font></a></i> ( transport provider ) may choose to divert from
      its path to service a new request from another <i><a href="#idE444860D95E5458a9BA4CF4BCE3EAD71"><font
      color="#0000ff"><u>transport user</u></font></a></i> ( transport user ) while
      servicing an earlier transport consumer'
  examples:
  - content: ridesplitting
  terms:
  - type: expression
    normative_status: preferred
    designation: paired on-demand
  language_code: eng
  entry_status: valid
  annotations: []
