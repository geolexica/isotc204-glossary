  definition:
  - content: '&lt;system&gt; context determining the setting and circumstances of
      all influences upon a <i><a href="#id9F9DE40282B84b8aAD4F618C7836F09E"><font
      color="#0000ff"><u>system</u></font></a></i> ( system )'
